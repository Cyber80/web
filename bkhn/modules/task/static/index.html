<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ภาระงาน | Calendar Sandbox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div>
    <h1>Workload Calendar</h1>
    <p>ระบบบันทึกภาระงาน • Private / Public • Google Calendar</p>
  </div>
  <div id="account"></div>
</header>

<main>
  <section id="login" class="card">
    <h2>เข้าสู่ระบบ</h2>
    <p>ทดสอบได้ทันทีด้วย Sandbox Login หรือใช้ Google OAuth จริงเมื่อกำหนดค่าใน .env</p>
    <a class="btn primary" href="/auth/google">เข้าสู่ระบบด้วย Google / Sandbox</a>
  </section>

  <section id="app" hidden>
    <div class="toolbar">
      <button class="btn primary" onclick="openForm()">+ เพิ่มภาระงาน</button>
      <button class="btn" onclick="syncAll()">↻ Sync ทั้งหมด</button>
      <a class="btn" href="/auth/logout">ออกจากระบบ</a>
    </div>

    <div class="stats">
      <div class="stat"><b id="total">0</b><span>ทั้งหมด</span></div>
      <div class="stat"><b id="privateCount">0</b><span>ส่วนตัว</span></div>
      <div class="stat"><b id="publicCount">0</b><span>สาธารณะ</span></div>
      <div class="stat"><b id="syncedCount">0</b><span>Sync แล้ว</span></div>
    </div>

    <div id="list" class="grid"></div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="close" onclick="closeForm()">×</button>
    <h2 id="formTitle">เพิ่มภาระงาน</h2>
    <form id="workloadForm">
      <input type="hidden" id="id">
      <label>ชื่องาน<input id="title" required maxlength="200"></label>
      <label>รายละเอียด<textarea id="description"></textarea></label>
      <div class="row">
        <label>เริ่ม<input id="start_at" type="datetime-local" required></label>
        <label>สิ้นสุด<input id="end_at" type="datetime-local" required></label>
      </div>
      <label>สถานที่<input id="location"></label>
      <label>การมองเห็น
        <select id="visibility">
          <option value="private">Private — เห็นเฉพาะฉัน</option>
          <option value="public">Public — ผู้ใช้ในระบบเห็นได้</option>
        </select>
      </label>
      <button class="btn primary" type="submit">บันทึก</button>
    </form>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
