<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เก่งได้ - ระบบจัดการการเรียนรวม LD (โรงเรียนบ้านเขาหัวนา)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F6F4; --bg-card:#FFFFFF; --sidebar:#1B3E42;
    --ink:#1F3A3D; --ink-soft:#5A7377; --ink-faint:#8FA5A8;
    --teal:#2D6E7E; --teal-dark:#204F5B; --teal-pale:#E4F0EE;
    --amber:#F2A65A; --amber-dark:#D98A3D; --amber-pale:#FBEADB;
    --leaf:#6FA96D; --leaf-pale:#E7F4E6;
    --coral:#E2685E; --coral-pale:#FBEAE8;
    --plum:#8B7FD1; --plum-pale:#EEEBFB;
    --border:#DCE8E6;
    --radius-lg:24px; --radius-md:16px; --radius-sm:10px;
    --shadow:0 6px 18px rgba(27,62,66,0.08);
    --shadow-lg:0 16px 36px rgba(27,62,66,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Sarabun',sans-serif; color:var(--ink); background:var(--bg); }
  h1,h2,h3,h4{font-family:'Mitr',sans-serif; margin:0;}
  button{font-family:inherit;}

  .shell{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex-shrink:0; background:var(--sidebar); color:#DCEAE8;
    display:flex; flex-direction:column; padding:22px 14px;
  }
  .sb-brand{display:flex; align-items:center; gap:10px; padding:0 8px 22px; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:16px;}
  .sb-brand .mark{width:38px;height:38px;border-radius:11px; background:linear-gradient(135deg,var(--teal),var(--leaf)); display:flex;align-items:center;justify-content:center; font-size:19px;}
  .sb-brand h1{font-size:17px; color:#fff;}
  .sb-brand p{margin:1px 0 0; font-size:11px; color:#9FC4C0;}
  .sb-nav{display:flex; flex-direction:column; gap:3px; flex:1;}
  .sb-nav button{
    display:flex; align-items:center; gap:10px; text-align:left;
    background:transparent; border:none; color:#B9D3D0; padding:11px 12px;
    border-radius:var(--radius-sm); font-size:14.5px; cursor:pointer; font-weight:500;
    transition:all .12s ease;
  }
  .sb-nav button .ic{font-size:16px; width:20px; text-align:center;}
  .sb-nav button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .sb-nav button.active{background:var(--teal); color:#fff; box-shadow:var(--shadow);}
  .sb-foot{font-size:11px; color:#6E9490; padding:10px 8px 0;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:26px 32px 60px; max-width:1180px;}
  @media (max-width:900px){ .shell{flex-direction:column;} .sidebar{width:100%; flex-direction:row; align-items:center; overflow-x:auto;} .sb-nav{flex-direction:row;} .sb-foot{display:none;} .main{padding:20px 16px 48px;} }

  .page-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .page-head h2{font-size:23px; color:var(--teal-dark);}
  .page-head p{margin:4px 0 0; font-size:13.5px; color:var(--ink-soft);}
  .yr-select{
    display:flex; align-items:center; gap:8px; background:var(--bg-card); border:1px solid var(--border);
    border-radius:999px; padding:8px 16px; box-shadow:var(--shadow); font-size:13.5px; font-weight:600; color:var(--teal-dark);
  }
  .yr-select select{border:none; background:transparent; font-family:'Sarabun',sans-serif; font-weight:600; color:var(--teal-dark); font-size:13.5px;}

  .card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:26px;}
  .card + .card{margin-top:18px;}
  .card h3{font-size:16.5px; color:var(--ink); margin-bottom:4px;}
  .card .sub{font-size:13px; color:var(--ink-soft); margin-bottom:16px;}

  .btn{border:none; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:500; font-family:'Mitr',sans-serif; cursor:pointer; transition:transform .1s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--teal); color:#fff; box-shadow:var(--shadow);}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent; border:1.5px solid var(--border); color:var(--ink-soft);}
  .btn-danger{background:var(--coral-pale); color:#8C332C;}
  .btn-sm{padding:6px 13px; font-size:12.5px;}

  /* stat cards */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  @media (max-width:900px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }
  .stat-card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow);}
  .stat-card .num{font-family:'Mitr',sans-serif; font-size:27px; font-weight:600; color:var(--teal-dark);}
  .stat-card .lbl{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  /* table */
  table{width:100%; border-collapse:collapse; font-size:13.8px;}
  th{text-align:left; font-family:'Mitr',sans-serif; font-weight:500; font-size:12.5px; color:var(--ink-soft); padding:9px 10px; border-bottom:2px solid var(--border);}
  td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FAFDFC;}
  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; margin:2px 3px 2px 0;}
  .badge.teal{background:var(--teal-pale); color:var(--teal-dark);}
  .badge.amber{background:var(--amber-pale); color:var(--amber-dark);}
  .badge.leaf{background:var(--leaf-pale); color:#2E5A2C;}
  .badge.coral{background:var(--coral-pale); color:#8C332C;}
  .badge.plum{background:var(--plum-pale); color:#5B4FA0;}
  .row-actions{display:flex; gap:6px;}

  /* forms */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:13px; font-weight:600; color:var(--ink);}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    font-family:'Sarabun',sans-serif; font-size:14px; padding:10px 12px; border-radius:var(--radius-sm);
    border:1.5px solid var(--border); background:#FBFDFC; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:70px;}
  .checkbox-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .chip-toggle{
    border:1.5px solid var(--border); background:#FBFDFC; padding:8px 14px; border-radius:999px;
    font-size:13px; cursor:pointer; color:var(--ink-soft); transition:all .12s ease;
  }
  .chip-toggle.on{background:var(--teal); border-color:var(--teal); color:#fff;}

  .empty{text-align:center; padding:44px 20px; color:var(--ink-soft);}
  .empty .glyph{font-size:40px; margin-bottom:10px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(27,62,66,0.35); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:28px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto;}
  .modal h3{margin-bottom:16px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

  /* difficulty pill */
  .diff-1{background:var(--leaf-pale); color:#2E5A2C;}
  .diff-2{background:var(--amber-pale); color:var(--amber-dark);}
  .diff-3{background:var(--coral-pale); color:#8C332C;}

  /* bars for report */
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .bar-label{width:120px; font-size:13px; color:var(--ink-soft); flex-shrink:0;}
  .bar-track{flex:1; background:#EEF4F3; border-radius:999px; height:14px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--teal),var(--leaf));}
  .bar-val{width:42px; text-align:right; font-size:12.5px; color:var(--ink-soft); flex-shrink:0;}

  /* practice screen reuse */
  .prompt-row{display:flex; align-items:center; gap:16px; justify-content:center; margin:6px 0 26px;}
  .emoji-tile{font-size:58px; background:#F6FAF9; border-radius:var(--radius-md); width:108px;height:108px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); flex-shrink:0;}
  .speak-btn{border:none; background:var(--teal); color:#fff; width:58px;height:58px; border-radius:50%; font-size:24px; cursor:pointer; box-shadow:var(--shadow); display:flex;align-items:center;justify-content:center;}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .choices{grid-template-columns:1fr;} }
  .choice-btn{font-size:21px; font-weight:600; padding:18px; border-radius:var(--radius-md); border:2px solid var(--border); background:#fff; cursor:pointer;}
  .choice-btn.correct{background:var(--leaf-pale); border-color:var(--leaf); color:#2E5A2C;}
  .choice-btn.wrong{background:var(--coral-pale); border-color:var(--coral); color:#8C332C;}
  .word-target{display:flex; justify-content:center; gap:9px; margin-bottom:22px; flex-wrap:wrap;}
  .letter-slot{width:50px;height:58px; border-radius:var(--radius-sm); border:2px dashed var(--border); background:#F6FAF9; display:flex; align-items:center; justify-content:center; font-size:25px; font-weight:700; color:var(--teal-dark);}
  .letter-slot.filled{border-style:solid; border-color:var(--teal);}
  .letter-bank{display:flex; gap:9px; justify-content:center; flex-wrap:wrap;}
  .letter-tile{width:50px;height:50px; border-radius:var(--radius-sm); border:none; background:var(--amber); color:#fff; font-size:21px; font-weight:700; cursor:pointer; box-shadow:var(--shadow);}
  .letter-tile:disabled{opacity:0.25;}
  .feedback-banner{text-align:center; font-family:'Mitr',sans-serif; font-size:15px; padding:11px; border-radius:var(--radius-sm); margin-top:16px;}
  .feedback-banner.ok{background:var(--leaf-pale); color:#2E5A2C;}
  .feedback-banner.no{background:var(--coral-pale); color:#8C332C;}
  .action-row{display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap;}

  @media print{
    .sidebar, .page-head .yr-select, .no-print{display:none !important;}
    .main{padding:0; max-width:100%;}
    body{background:#fff;}
    .card{box-shadow:none; border:1px solid #ccc;}
  }
</style>
</head>
<body>
<div class="shell" id="shell"></div>

<script>
/* ================== CONFIG ==================
   แก้ 2 ค่านี้หลัง Deploy Apps Script เสร็จแล้ว:
   1. APPS_SCRIPT_URL = URL ที่ได้จากตอน Deploy > New deployment > Web app
   2. SECRET_KEY = ต้องตรงกับ SECRET_KEY ที่ตั้งไว้ในไฟล์ Code.gs
================================================= */
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzLtosz31N3zeOynEBP2bIudZhafSCX4DUZRG89As8AH4nOzBTXiq8WphBI2OMw4Itp/exec", // เช่น "https://script.google.com/macros/s/XXXXXXXX/exec"
  SECRET_KEY: "Bk90919293949596979899$",       // ต้องตรงกับ Code.gs
  SCHOOL_NAME: "โรงเรียนบ้านเขาหัวนา",
};

/* ================== CONSTANTS ================== */
const DISABILITY_TYPES = [
  {id:"dyslexia", label:"บกพร่องด้านการอ่าน (Dyslexia)"},
  {id:"dysgraphia", label:"บกพร่องด้านการเขียน (Dysgraphia)"},
  {id:"dyscalculia", label:"บกพร่องด้านคณิตศาสตร์ (Dyscalculia)"},
  {id:"adhd", label:"สมาธิสั้นร่วม (ADHD)"},
  {id:"language", label:"บกพร่องด้านภาษา-สื่อสาร"},
  {id:"visualmotor", label:"บกพร่องด้านการรับรู้ภาพ-การเคลื่อนไหว"},
];
const MEDIA_OPTIONS = [
  "Text-to-Speech", "Speech-to-Text", "ใบงานดิจิทัลลากวาง", "แอป AAC",
  "ตัวจับเวลาแบบภาพ", "ฟอนต์อ่านง่าย", "คีย์บอร์ด/ปุ่มขนาดใหญ่", "วิดีโอขั้นตอนพร้อมภาพ"
];
const DIFF_LABEL = {1:"ง่าย", 2:"กลาง", 3:"ยาก"};
const DIFF_CLASS = {1:"diff-1", 2:"diff-2", 3:"diff-3"};
const CATEGORIES = ["สัตว์","ธรรมชาติ","ของใช้","การกระทำ","ครอบครัว","อาหาร","อื่นๆ"];

const DEFAULT_WORDS = [
  {id:"w1", word:"แมว", emoji:"🐱", difficulty:1, category:"สัตว์", distract:["แหม","แมง","แขว"]},
  {id:"w2", word:"หมา", emoji:"🐶", difficulty:1, category:"สัตว์", distract:["หนา","หมู","มา"]},
  {id:"w3", word:"ปลา", emoji:"🐟", difficulty:1, category:"สัตว์", distract:["ผลา","บลา","ปา"]},
  {id:"w4", word:"นก", emoji:"🐦", difficulty:1, category:"สัตว์", distract:["นค","ยก","ลก"]},
  {id:"w5", word:"ไก่", emoji:"🐔", difficulty:1, category:"สัตว์", distract:["ไก","ใก่","ไข่"]},
  {id:"w6", word:"บ้าน", emoji:"🏠", difficulty:2, category:"ของใช้", distract:["ปาน","บาน","ป้าน"]},
  {id:"w7", word:"ดอกไม้", emoji:"🌸", difficulty:2, category:"ธรรมชาติ", distract:["ดอกไข่","ตอกไม้","ดอกไม"]},
  {id:"w8", word:"รถ", emoji:"🚗", difficulty:1, category:"ของใช้", distract:["รด","ลด","รส"]},
  {id:"w9", word:"เรือ", emoji:"⛵", difficulty:2, category:"ของใช้", distract:["เรีอ","เมือ","เรือง"]},
  {id:"w10", word:"หนังสือ", emoji:"📖", difficulty:2, category:"ของใช้", distract:["หนังสีอ","หนังสั้น","นังสือ"]},
  {id:"w11", word:"ดวงจันทร์", emoji:"🌙", difficulty:3, category:"ธรรมชาติ", distract:["ดวงจันร์","ควงจันทร์","ดวงจัน"]},
  {id:"w12", word:"ดาว", emoji:"⭐", difficulty:1, category:"ธรรมชาติ", distract:["ดาย","ดว","ตาว"]},
  {id:"w13", word:"แดด", emoji:"☀️", difficulty:1, category:"ธรรมชาติ", distract:["แคด","แดค","แดง"]},
  {id:"w14", word:"ฝน", emoji:"🌧️", difficulty:1, category:"ธรรมชาติ", distract:["ผน","ฝม","ฟน"]},
  {id:"w15", word:"ต้นไม้", emoji:"🌳", difficulty:2, category:"ธรรมชาติ", distract:["ต้นไข่","ตันไม้","ต้นไม"]},
  {id:"w16", word:"กระโดด", emoji:"🤸", difficulty:3, category:"การกระทำ", distract:["กระโดก","กระดด","กระโด"]},
  {id:"w17", word:"ข้าว", emoji:"🍚", difficulty:1, category:"อาหาร", distract:["ค้าว","ข่าว","เข้า"]},
  {id:"w18", word:"แม่", emoji:"👩", difficulty:1, category:"ครอบครัว", distract:["แหม่","แม","แน่"]},
];

function currentThaiAcademicYear(){
  const now = new Date();
  const y = now.getFullYear() + 543;
  return (now.getMonth() >= 4) ? y : y - 1; // ปีการศึกษาเริ่มพ.ค.
}
const uid = ()=> Math.random().toString(36).slice(2,10);

/* ================== STATE ================== */
let state = {
  page: "dashboard",
  academicYear: currentThaiAcademicYear(),
  students: [],
  iepMap: {},      // key `${studentId}:${year}` -> iep obj
  words: [],
  progress: {},     // studentId -> {attempts:{wordId:{correct,tries}}, totalCorrect, totalTries, history:[]}
  modal: null,      // {type, payload}
  practice: { studentId:null, module:null, difficulty:null, ex:null },
  reportStudentId: null,
  auth: null,        // {token, teacherId, name, role, assignedStudentIds}
  teachers: [],
  loginError: null,
};

/* ================== PERSISTENCE (Google Sheets via Apps Script) ================== */
function safeParseArr(str){ try{ const v = JSON.parse(str); return Array.isArray(v)?v:[]; }catch(e){ return []; } }

async function apiCall(action, data){
  // ใช้ body เป็น string ธรรมดา ไม่ตั้ง Content-Type เอง เพื่อเลี่ยง CORS preflight ที่ Apps Script Web App จัดการเองไม่ได้
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({ key: CONFIG.SECRET_KEY, action, data, token: state.auth ? state.auth.token : null }),
  });
  const json = await res.json();
  if(!json.ok){
    if(json.error === "session-expired"){ state.auth = null; boot(); }
    throw new Error(json.error || "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์");
  }
  return json.result;
}

async function apiLogin(email, pin){
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({ key: CONFIG.SECRET_KEY, action: "login", data: { email, pin } }),
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "เข้าสู่ระบบไม่สำเร็จ");
  return json.result;
}

async function apiSaveTeacher(t){ return apiCall("saveTeacher", t); }
async function apiDeleteTeacher(id){ return apiCall("deleteTeacher", {id}); }
async function apiListTeachers(){ return apiCall("listTeachers", {}); }
async function apiSaveAssignments(teacherId, studentIds){ return apiCall("saveAssignments", {teacherId, studentIds}); }

async function loadAll(){
  state.loadError = null;
  try{
    const result = await apiCall("getAll", {});
    state.students = (result.students||[]).map(s=>({...s, academicYear: parseInt(s.academicYear)}));

    let words = (result.words||[]).map(w=>({...w, difficulty: parseInt(w.difficulty), distract: Array.isArray(w.distract)?w.distract:safeParseArr(w.distract)}));
    if(words.length===0 && state.auth && state.auth.role==="admin"){
      // ครั้งแรกที่ยังไม่มีคำในชีต: ส่งคำตั้งต้นขึ้นไปเก็บไว้ (แอดมินเท่านั้นที่ทำได้)
      for(const w of DEFAULT_WORDS){ await apiCall("saveWord", w); }
      words = DEFAULT_WORDS;
    }
    state.words = words;

    state.iepMap = {};
    (result.iep||[]).forEach(r=>{
      const key = `${r.studentId}:${parseInt(r.academicYear)}`;
      state.iepMap[key] = {
        disabilities: Array.isArray(r.disabilities)?r.disabilities:safeParseArr(r.disabilities),
        mediaUsed: Array.isArray(r.mediaUsed)?r.mediaUsed:safeParseArr(r.mediaUsed),
        difficulty: parseInt(r.difficulty)||2,
        shortGoal: r.shortGoal||"", longGoal: r.longGoal||"", notes: r.notes||"",
        updatedAt: r.updatedAt,
      };
    });

    state.progress = {};
    (result.attempts||[]).forEach(a=>{
      if(!state.progress[a.studentId]) state.progress[a.studentId] = {attempts:{}, totalCorrect:0, totalTries:0, history:[]};
      const correct = parseInt(a.correct)||0, tries = parseInt(a.tries)||0;
      state.progress[a.studentId].attempts[a.wordId] = {correct, tries};
      state.progress[a.studentId].totalCorrect += correct;
      state.progress[a.studentId].totalTries += tries;
    });
  }catch(e){
    console.error("load failed", e);
    state.loadError = e.message;
    state.words = state.words.length ? state.words : DEFAULT_WORDS;
  }
}

async function apiSaveStudent(student){ return apiCall("saveStudent", student); }
async function apiDeleteStudent(id){ return apiCall("deleteStudent", {id}); }
async function apiSaveIep(iepRecord){ return apiCall("saveIep", iepRecord); }
async function apiSaveWord(word){ return apiCall("saveWord", word); }
async function apiDeleteWord(id){ return apiCall("deleteWord", {id}); }
async function apiRecordAttempt(payload){ return apiCall("recordAttempt", payload); }

/* ================== HELPERS ================== */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function studentsInYear(){ return state.students.filter(s=>s.academicYear===state.academicYear); }
function getIep(studentId, year){ return state.iepMap[`${studentId}:${year}`] || null; }
function getProgress(studentId){ return state.progress[studentId] || {attempts:{}, totalCorrect:0, totalTries:0, history:[]}; }
function ensureProgress(studentId){ if(!state.progress[studentId]) state.progress[studentId] = {attempts:{}, totalCorrect:0, totalTries:0, history:[]}; return state.progress[studentId]; }

function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "th-TH"; u.rate = rate || 0.9;
  const voices = window.speechSynthesis.getVoices();
  const thV = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("th"));
  if(thV) u.voice = thV;
  window.speechSynthesis.speak(u);
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ================== DASHBOARD ================== */
function renderDashboard(){
  const wrap = el('div');
  const list = studentsInYear();
  let totalTries=0, totalCorrect=0, weakCount=0;
  list.forEach(s=>{
    const p = getProgress(s.id);
    totalTries += p.totalTries; totalCorrect += p.totalCorrect;
    const weak = Object.values(p.attempts).filter(a=>a.tries>0 && a.correct/a.tries<0.6).length;
    if(weak>0) weakCount++;
  });
  const acc = totalTries>0 ? Math.round(100*totalCorrect/totalTries) : 0;

  const grid = el('div','stat-grid');
  const stats = [
    [list.length, "นักเรียนในปีการศึกษานี้"],
    [totalTries, "ครั้งที่ฝึกทั้งหมด"],
    [acc+'%', "ความแม่นยำเฉลี่ย"],
    [weakCount, "คนที่มีคำอ่อนที่ควรฝึกเพิ่ม"],
  ];
  stats.forEach(([n,l])=>{
    const c = el('div','stat-card');
    c.appendChild(el('div','num',n));
    c.appendChild(el('div','lbl',l));
    grid.appendChild(c);
  });
  wrap.appendChild(grid);

  const card = el('div','card');
  card.appendChild(el('h3',null,'สรุปรายนักเรียน'));
  card.appendChild(el('p','sub','เรียงตามความแม่นยำ จากน้อยไปมาก เพื่อดูว่าใครควรได้รับการฝึกเพิ่มก่อน'));
  if(list.length===0){
    const e = el('div','empty');
    e.appendChild(el('div','glyph','🧒'));
    e.appendChild(el('p',null,'ยังไม่มีนักเรียนในปีการศึกษานี้ ไปที่เมนู "นักเรียน" เพื่อเพิ่ม'));
    card.appendChild(e);
  }else{
    const rows = list.map(s=>{
      const p = getProgress(s.id);
      const acc2 = p.totalTries>0 ? Math.round(100*p.totalCorrect/p.totalTries) : null;
      return {s, acc:acc2, tries:p.totalTries};
    }).sort((a,b)=>(a.acc??101)-(b.acc??101));
    const tbl = document.createElement('table');
    tbl.innerHTML = `<thead><tr><th>ชื่อ</th><th>ชั้น</th><th>ความบกพร่อง</th><th>ครั้งที่ฝึก</th><th>ความแม่นยำ</th></tr></thead>`;
    const tb = document.createElement('tbody');
    rows.forEach(({s,acc,tries})=>{
      const tr = document.createElement('tr');
      const iep = getIep(s.id, state.academicYear);
      const badges = (iep?.disabilities||[]).map(d=>{
        const lbl = DISABILITY_TYPES.find(x=>x.id===d)?.label.split(' (')[0] || d;
        return `<span class="badge teal">${lbl}</span>`;
      }).join('');
      tr.innerHTML = `<td><strong>${s.name}</strong></td><td>${s.grade||'-'}</td><td>${badges||'<span class="badge plum">ยังไม่ระบุ</span>'}</td><td>${tries}</td><td>${acc===null?'-':acc+'%'}</td>`;
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    card.appendChild(tbl);
  }
  wrap.appendChild(card);
  return wrap;
}

    readCard.onclick = ()=>{ state.practice.module='read'; state.practice.difficulty=parseInt(diffSel.value); state.practice.ex=null; render(); };
    const writeCard = el('div','card'); writeCard.style.cursor='pointer';
    writeCard.innerHTML = `<h3>✏️ ฝึกเขียน</h3><p class="sub">ฟังเสียง ลากตัวอักษรเรียงคำ</p>`;
    writeCard.onclick = ()=>{ state.practice.module='write'; state.practice.difficulty=parseInt(diffSel.value); state.practice.ex=null; render(); };
    modeGrid.appendChild(readCard); modeGrid.appendChild(writeCard);
    card.appendChild(modeGrid);

    wrap.appendChild(card);
    return wrap;
  }

  // active exercise
  const card = el('div','card');
  const backBtn = el('button','btn btn-ghost btn-sm no-print','← กลับ');
  backBtn.onclick = ()=>{ state.practice.module=null; render(); };
  card.appendChild(backBtn);
  const headTag = el('div'); headTag.style.cssText="margin:14px 0 6px; font-family:'Mitr',sans-serif; font-size:14px; color:var(--teal-dark); font-weight:600;";
  headTag.textContent = `${student.name} · ${state.practice.module==='read'?'ฝึกอ่าน':'ฝึกเขียน'} · ระดับ${DIFF_LABEL[state.practice.difficulty]}`;
  card.appendChild(headTag);

  const pool = state.words.filter(w=>w.difficulty===state.practice.difficulty);
  const usePool = pool.length>=4 ? pool : state.words; // fallback ถ้าคำในระดับนี้น้อยเกินไป

  if(state.practice.module==='read') renderReadInto(card, student, usePool);
  else renderWriteInto(card, student, usePool);

  wrap.appendChild(card);
  return wrap;
}

function pickWordFor(student, pool, excludeWord){
  const prog = getProgress(student.id);
  const weighted = [];
  pool.forEach(w=>{
    const rec = prog.attempts[w.id];
    let weight = 3;
    if(rec){ const a = rec.correct/Math.max(1,rec.tries); weight = a<0.5?6:a<0.8?3:1; }
    if(w.word===excludeWord) weight = Math.max(1, Math.floor(weight/3));
    for(let i=0;i<weight;i++) weighted.push(w);
  });
  return weighted[Math.floor(Math.random()*weighted.length)];
}

async function recordAttempt(student, wordId, correct, module){
  const prog = ensureProgress(student.id);
  if(!prog.attempts[wordId]) prog.attempts[wordId] = {correct:0, tries:0};
  prog.attempts[wordId].tries += 1;
  if(correct) prog.attempts[wordId].correct += 1;
  prog.totalTries += 1;
  if(correct) prog.totalCorrect += 1;
  try{
    await apiRecordAttempt({ studentId: student.id, wordId, correct: !!correct, module });
  }catch(e){
    console.error("บันทึกผลไปที่ Sheets ไม่สำเร็จ", e);
  }
}

function renderReadInto(card, student, pool){
  if(!state.practice.ex){
    const item = pickWordFor(student, pool, null);
    const distractSrc = item.distract && item.distract.length>=3 ? item.distract : shuffle(pool.filter(x=>x.id!==item.id).map(x=>x.word)).slice(0,3);
    const options = shuffle([item.word, ...shuffle(distractSrc).slice(0,3)]);
    state.practice.ex = {item, options, answered:false, played:false};
  }
  const ex = state.practice.ex;
  const promptRow = el('div','prompt-row');
  promptRow.appendChild(el('div','emoji-tile', ex.item.emoji||'🔤'));
  const sBtn = el('button','speak-btn','🔊'); sBtn.onclick = ()=>speak(ex.item.word);
  promptRow.appendChild(sBtn);
  card.appendChild(promptRow);

  const choices = el('div','choices');
  ex.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className='choice-btn'; b.textContent=opt;
    b.onclick = async ()=>{
      if(ex.answered) return;
      ex.answered = true;
      const correct = opt===ex.item.word;
      Array.from(choices.children).forEach(c=>{
        c.disabled = true;
        if(c.textContent===ex.item.word) c.classList.add('correct');
        else if(c===b && !correct) c.classList.add('wrong');
      });
      await recordAttempt(student, ex.item.id, correct, 'read');
      const banner = el('div','feedback-banner '+(correct?'ok':'no'), correct?'✅ เก่งมาก! ถูกต้อง':`ลองใหม่นะ คำตอบคือ "${ex.item.word}"`);
      card.appendChild(banner);
      const actions = el('div','action-row');
      const nextBtn = el('button','btn btn-primary','คำถัดไป →');
      nextBtn.onclick = ()=>{ state.practice.ex=null; render(); };
      actions.appendChild(nextBtn);
      card.appendChild(actions);
    };
    choices.appendChild(b);
  });
  card.appendChild(choices);
  const actions = el('div','action-row');
  const replay = el('button','btn btn-ghost','🔁 ฟังอีกครั้ง'); replay.onclick=()=>speak(ex.item.word);
  actions.appendChild(replay);
  card.appendChild(actions);
  if(!ex.played){ ex.played=true; setTimeout(()=>speak(ex.item.word),250); }
}

function renderWriteInto(card, student, pool){
  if(!state.practice.ex){
    const item = pickWordFor(student, pool, null);
    state.practice.ex = {item, letters:shuffle(item.word.split('')), slots:new Array(item.word.length).fill(null), usedIdx:new Set(), answered:false, played:false};
  }
  const ex = state.practice.ex;
  const promptRow = el('div','prompt-row');
  promptRow.appendChild(el('div','emoji-tile', ex.item.emoji||'🔤'));
  const sBtn = el('button','speak-btn','🔊'); sBtn.onclick = ()=>speak(ex.item.word);
  promptRow.appendChild(sBtn);
  card.appendChild(promptRow);

  const target = el('div','word-target');
  ex.slots.forEach(val=>{ target.appendChild(el('div','letter-slot'+(val!==null?' filled':''), val!==null?val:'')); });
  card.appendChild(target);

  const bank = el('div','letter-bank');
  ex.letters.forEach((ch, idx)=>{
    const t = document.createElement('button');
    t.className='letter-tile'; t.textContent=ch; t.disabled = ex.usedIdx.has(idx);
    t.onclick = async ()=>{
      if(ex.answered) return;
      const pos = ex.slots.findIndex(s=>s===null);
      if(pos===-1) return;
      ex.slots[pos]=ch; ex.usedIdx.add(idx);
      render();
      if(ex.slots.every(s=>s!==null)){
        const built = ex.slots.join('');
        const correct = built===ex.item.word;
        ex.answered = true;
        await recordAttempt(student, ex.item.id, correct, 'write');
        setTimeout(()=>{
          const card2 = document.querySelectorAll('.card')[document.querySelectorAll('.card').length-1] || card;
          const banner = el('div','feedback-banner '+(correct?'ok':'no'), correct?'✅ สะกดถูกต้อง เก่งมาก!':`ยังไม่ถูกนะ คำที่ถูกต้องคือ "${ex.item.word}"`);
          card2.appendChild(banner);
          const actions = el('div','action-row');
          if(!correct){
            const retry = el('button','btn btn-ghost','↺ ลองใหม่');
            retry.onclick = ()=>{ ex.slots.fill(null); ex.usedIdx.clear(); ex.answered=false; render(); };
            actions.appendChild(retry);
          }
          const nextBtn = el('button','btn btn-primary','คำถัดไป →');
          nextBtn.onclick = ()=>{ state.practice.ex=null; render(); };
          actions.appendChild(nextBtn);
          card2.appendChild(actions);
        }, 50);
      }
    };
    bank.appendChild(t);
  });
  card.appendChild(bank);
  const actions = el('div','action-row');
  const clearBtn = el('button','btn btn-ghost','↺ เริ่มคำนี้ใหม่');
  clearBtn.onclick = ()=>{ ex.slots.fill(null); ex.usedIdx.clear(); ex.answered=false; render(); };
  actions.appendChild(clearBtn);
  const replay = el('button','btn btn-ghost','🔁 ฟังอีกครั้ง'); replay.onclick=()=>speak(ex.item.word);
  actions.appendChild(replay);
  card.appendChild(actions);
  if(!ex.played){ ex.played=true; setTimeout(()=>speak(ex.item.word),250); }
}

function studentForm(existing){
  const wrap = el('div');
  wrap.appendChild(el('h3',null, existing?'แก้ไขข้อมูลนักเรียน':'เพิ่มนักเรียนใหม่'));
  const grid = el('div','form-grid');

  const f1 = el('div','field full');
  f1.appendChild(el('label',null,'ชื่อเล่น / รหัสนักเรียน'));
  const nameInp = document.createElement('input'); nameInp.type='text'; nameInp.value = existing?.name||'';
  f1.appendChild(nameInp);
  grid.appendChild(f1);

  const f2 = el('div','field');
  f2.appendChild(el('label',null,'ชั้นเรียน'));
  const gradeInp = document.createElement('input'); gradeInp.type='text'; gradeInp.placeholder='เช่น ป.3'; gradeInp.value = existing?.grade||'';
  f2.appendChild(gradeInp);
  grid.appendChild(f2);

  const f3 = el('div','field');
  f3.appendChild(el('label',null,'ปีการศึกษา'));
  const yrInp = document.createElement('input'); yrInp.type='number'; yrInp.value = existing?.academicYear || state.academicYear;
  f3.appendChild(yrInp);
  grid.appendChild(f3);

  wrap.appendChild(grid);

  const actions = el('div','modal-actions');
  const cancel = el('button','btn btn-ghost','ยกเลิก'); cancel.onclick = ()=>{ state.modal=null; render(); };
  const save = el('button','btn btn-primary', existing?'บันทึกการแก้ไข':'เพิ่มนักเรียน');
  save.onclick = async ()=>{
    if(!nameInp.value.trim()){ alert('กรุณากรอกชื่อนักเรียน'); return; }
    const record = existing
      ? {...existing, name: nameInp.value.trim(), grade: gradeInp.value.trim(), academicYear: parseInt(yrInp.value)||state.academicYear}
      : {id: uid(), name: nameInp.value.trim(), grade: gradeInp.value.trim(), academicYear: parseInt(yrInp.value)||state.academicYear, createdAt: new Date().toISOString()};
    try{
      await apiSaveStudent(record);
      if(existing){ Object.assign(existing, record); }
      else{ state.students.push(record); }
      state.modal=null; render();
    }catch(e){ alert("บันทึกไม่สำเร็จ: " + e.message); }
  };
  actions.appendChild(cancel); actions.appendChild(save);
  wrap.appendChild(actions);
  return wrap;
}

function wordForm(existing){
  const wrap = el('div');
  wrap.appendChild(el('h3',null, existing?'แก้ไขคำศัพท์':'เพิ่มคำศัพท์ใหม่'));
  const grid = el('div','form-grid');

  const f1 = el('div','field');
  f1.appendChild(el('label',null,'คำศัพท์'));
  const wordInp = document.createElement('input'); wordInp.type='text'; wordInp.value = existing?.word||'';
  f1.appendChild(wordInp);
  grid.appendChild(f1);

  const f2 = el('div','field');
  f2.appendChild(el('label',null,'อีโมจิ/สัญลักษณ์ประกอบ'));
  const emojiInp = document.createElement('input'); emojiInp.type='text'; emojiInp.placeholder='🐱'; emojiInp.value = existing?.emoji||'';
  f2.appendChild(emojiInp);
  grid.appendChild(f2);

  const f3 = el('div','field');
  f3.appendChild(el('label',null,'หมวดหมู่'));
  const catSel = document.createElement('select');
  CATEGORIES.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; if(existing?.category===c) o.selected=true; catSel.appendChild(o); });
  f3.appendChild(catSel);
  grid.appendChild(f3);

  const f4 = el('div','field');
  f4.appendChild(el('label',null,'ระดับความยาก'));
  const diffSel = document.createElement('select');
  [1,2,3].forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent=DIFF_LABEL[d]; if(existing?.difficulty===d) o.selected=true; diffSel.appendChild(o); });
  f4.appendChild(diffSel);
  grid.appendChild(f4);

  const f5 = el('div','field full');
  f5.appendChild(el('label',null,'คำหลอก (คั่นด้วยจุลภาค , — ใช้เป็นตัวเลือกลวงในแบบฝึกอ่าน)'));
  const distractInp = document.createElement('input'); distractInp.type='text'; distractInp.value = (existing?.distract||[]).join(', ');
  f5.appendChild(distractInp);
  grid.appendChild(f5);

  wrap.appendChild(grid);

  const actions = el('div','modal-actions');
  const cancel = el('button','btn btn-ghost','ยกเลิก'); cancel.onclick = ()=>{ state.modal=null; render(); };
  const save = el('button','btn btn-primary', existing?'บันทึกการแก้ไข':'เพิ่มคำศัพท์');
  save.onclick = async ()=>{
    if(!wordInp.value.trim()){ alert('กรุณากรอกคำศัพท์'); return; }
    const distract = distractInp.value.split(',').map(s=>s.trim()).filter(Boolean);
    const record = existing
      ? {...existing, word:wordInp.value.trim(), emoji:emojiInp.value.trim(), category:catSel.value, difficulty:parseInt(diffSel.value), distract}
      : {id:uid(), word:wordInp.value.trim(), emoji:emojiInp.value.trim(), category:catSel.value, difficulty:parseInt(diffSel.value), distract};
    try{
      await apiSaveWord(record);
      if(existing){ Object.assign(existing, record); }
      else{ state.words.push(record); }
      state.modal=null; render();
    }catch(e){ alert("บันทึกไม่สำเร็จ: " + e.message); }
  };
  actions.appendChild(cancel); actions.appendChild(save);
  wrap.appendChild(actions);
  return wrap;
}

/* ================== SETUP / ERROR SCREENS ================== */

  const wrap = el('div');
  wrap.style.cssText = "max-width:640px; margin:60px auto; padding:0 20px;";
  const card = el('div','card');
  card.appendChild(el('h2',null,'⚙️ ยังไม่ได้ตั้งค่าการเชื่อมต่อ'));
  card.appendChild(el('p','sub', `แอปนี้ยังไม่ได้เชื่อมกับฐานข้อมูล Google Sheets ของ${CONFIG.SCHOOL_NAME} กรุณาทำตามขั้นตอนนี้ก่อนใช้งาน:`));
  card.appendChild(el('div',null, `
    <ol style="line-height:1.9; font-size:14.5px; color:var(--ink);">
      <li>เปิดไฟล์ <code>Code.gs</code> ที่ได้รับมา วางในโปรเจกต์ Apps Script ของ Google Sheet</li>
      <li>ตั้งค่า <code>SECRET_KEY</code> ใน Code.gs เป็นรหัสของคุณเอง</li>
      <li>Deploy &gt; New deployment &gt; Web app แล้วคัดลอก URL ที่ได้</li>
      <li>เปิดไฟล์ HTML นี้ด้วยโปรแกรมแก้ไขข้อความ หาบรรทัด <code>const CONFIG = {...}</code> ใกล้ด้านบนของไฟล์</li>
      <li>ใส่ URL ในช่อง <code>APPS_SCRIPT_URL</code> และรหัสในช่อง <code>SECRET_KEY</code> ให้ตรงกับ Code.gs</li>
      <li>บันทึกไฟล์แล้วเปิดใหม่อีกครั้ง</li>
    </ol>
  `));
  card.appendChild(el('p','sub','เมื่อกรอกครบแล้ว หน้านี้จะเปลี่ยนเป็นแอปเต็มรูปแบบโดยอัตโนมัติ'));
  wrap.appendChild(card);
  shell.appendChild(wrap);
}

function renderConnectionError(message){
  shell.innerHTML = "";
  const wrap = el('div');
  wrap.style.cssText = "max-width:640px; margin:60px auto; padding:0 20px;";
  const card = el('div','card');
  card.appendChild(el('h2',null,'🔌 เชื่อมต่อฐานข้อมูลไม่สำเร็จ'));
  card.appendChild(el('p','sub', `ตรวจสอบว่า Apps Script Web App ยัง Deploy อยู่ และ URL / SECRET_KEY ในไฟล์นี้ตรงกับ Code.gs — ข้อความข้อผิดพลาด: ${message}`));
  const retryBtn = el('button','btn btn-primary','ลองใหม่อีกครั้ง');
  retryBtn.onclick = boot;
  card.appendChild(retryBtn);
  wrap.appendChild(card);
  shell.appendChild(wrap);
}

function renderLoginScreen(){
  shell.innerHTML = "";
  const wrap = el('div');
  wrap.style.cssText = "max-width:420px; margin:80px auto; padding:0 20px;";
  const card = el('div','card');
  const brand = el('div'); brand.style.cssText="text-align:center; margin-bottom:20px;";
  brand.innerHTML = `<div style="font-size:38px;">📚</div><h2 style="margin-top:8px;">เก่งได้</h2><p class="sub">${CONFIG.SCHOOL_NAME}</p>`;
  card.appendChild(brand);

  const f1 = el('div','field'); f1.style.marginBottom="14px";
  f1.appendChild(el('label',null,'อีเมลครู'));
  const emailInp = document.createElement('input'); emailInp.type='text'; emailInp.placeholder='name@school.ac.th';
  f1.appendChild(emailInp);
  card.appendChild(f1);

  const f2 = el('div','field'); f2.style.marginBottom="6px";
  f2.appendChild(el('label',null,'PIN 4 หลัก'));
  const pinInp = document.createElement('input'); pinInp.type='password'; pinInp.maxLength=4; pinInp.placeholder='••••';
  f2.appendChild(pinInp);
  card.appendChild(f2);

  if(state.loginError){
    card.appendChild(el('p',null,`<span style="color:#8C332C; font-size:13px;">${state.loginError}</span>`));
  }

  const loginBtn = el('button','btn btn-primary','เข้าสู่ระบบ');
  loginBtn.style.cssText = "width:100%; margin-top:14px; padding:12px;";
  const doLogin = async ()=>{
    try{
      const result = await apiLogin(emailInp.value.trim(), pinInp.value.trim());
      state.auth = result;
      state.loginError = null;
      await bootAfterLogin();
    }catch(e){
      state.loginError = e.message;
      render();
    }
  };
  loginBtn.onclick = doLogin;
  pinInp.onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
  card.appendChild(loginBtn);
  wrap.appendChild(card);
  shell.appendChild(wrap);
}

/* ================== INIT ================== */
async function bootAfterLogin(){
  shell.innerHTML = "<div style='padding:60px; text-align:center; color:var(--ink-soft); font-family:Sarabun,sans-serif;'>กำลังโหลดข้อมูล...</div>";
  await loadAll();
  if(state.loadError){
    renderConnectionError(state.loadError);
    return;
  }
  if('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = ()=>{};
  render();
}

async function boot(){
  if(!CONFIG.APPS_SCRIPT_URL || !CONFIG.SECRET_KEY){
    renderSetupScreen();
    return;
  }
  if(!state.auth){
    renderLoginScreen();
    return;
  }
  await bootAfterLogin();
}
boot();
</script>
